<html>
<div class="bechem-form">
  <h2>Contact Form</h2>

  <form action="#" method="POST">

    <!-- Name -->
    <div class="row-2">
      <div class="form-group"><label>First Name *</label><input type="text" required></div>
      <div class="form-group"><label>Last Name *</label><input type="text" required></div>
    </div>

    <!-- Phone + Email -->
    <div class="row-2">
      <div class="form-group"><label>Phone Number *</label><input type="tel" required></div>
      <div class="form-group"><label>Email Address *</label><input type="email" required></div>
    </div>

    <!-- Company -->
    <div class="form-group"><label>Company *</label><input type="text" required></div>

    <!-- Address -->
    <div class="form-group"><label>Address *</label><input type="text" placeholder="Street Address" required></div>
    <div class="form-group"><input type="text" placeholder="Address Line 2"></div>

    <div class="row-3">
      <div class="form-group"><input type="text" placeholder="City"></div>
      <div class="form-group"><input type="text" placeholder="State"></div>
      <div class="form-group"><input type="text" value="India" readonly></div>
    </div>

    <!-- Dropdowns -->
    <div class="row-2">
      <div class="form-group">
        <label>Industry *</label>
        <select required>
          <option value="" disabled selected>Choose Your Industry</option>
          <option>Automotive</option>
          <option>Steel & Metal</option>
          <option>Textile</option>
          <option>Oil & Gas</option>
          <option>Mining</option>
          <option>General Engineering</option>
        </select>
      </div>

      <div class="form-group">
        <label>Lubricant Type *</label>
        <select required>
          <option value="" disabled selected>Choose Lubricants Type</option>
          <option>Industrial Grease</option>
          <option>High Temperature Grease</option>
          <option>Cutting Fluids</option>
          <option>Hydraulic Oils</option>
          <option>Gear Oils</option>
          <option>Specialty Lubricants</option>
        </select>
      </div>
    </div>

    <!-- Message -->
    <div class="form-group">
      <label>Message *</label>
      <textarea rows="4" required></textarea>
    </div>

    <!-- Verification Captcha -->
    <div class="captcha-box">
      <div class="g-recaptcha" data-sitekey="YOUR_SITE_KEY"></div>
    </div>

    <button class="submit-btn">Submit Form →</button>
  </form>
</div>
</html>
